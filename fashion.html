    <title>Fashion | David Ludington</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon-32x32.png">
    <script>

        theme: {
          extend: {
            colors: {
              bg: 'rgb(30, 30, 30)',
              card: 'rgb(28, 28, 28)',
              border: 'rgb(53, 53, 53)',
              borderLight: 'rgb(163, 163, 163)',
              textPrimary: 'rgb(155, 155, 155)',
              textSecondary: 'rgb(85, 85, 85)',

            fontFamily: {
              poppins: ['Poppins', 'sans-serif'],

    <nav id="hamburger-nav" class="fixed top-0 left-0 right-0 z-50 bg-bg h-16 flex items-center justify-between px-4 md:px-8 xl:hidden">
      <div class="logo text-textPrimary text-xl md:text-2xl"><a href="index.html">David Ludington</a></div>
      <div class="hamburger-menu relative">
        <button type="button" class="hamburger-icon p-2" onclick="toggleMenu()" aria-label="Toggle menu">

        </button>
        <div class="menu-links" id="menuLinks">
          <a href="work.html">Work</a>
          <a href="fashion.html">Creative</a>
        </div>
      </div>
    </nav>

        <div class="fashion-item">
